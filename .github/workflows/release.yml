name: Release VSCode Extension

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as prerelease version'
        required: true
        type: boolean
        default: false

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: npm install

      - name: Test formatter and CLI
        run: dotnet test ./tools/XamlStyler/src/XamlStyler.Cli.slnx -c Release

      - name: Build XamlStyler tool
        run: |
          dotnet publish -f net10.0 -p:RollForward=Major -o ./tools/xstyler ./tools/XamlStyler/src/XamlStyler.Console
          cp ./tools/XamlStyler/LICENSE ./tools/xstyler/LICENSE

      - name: Remove unnecessary files
        run: find ./tools/xstyler -type f \( -name '*.pdb' -o -name '*.exe' -o -name '*.deps.json' \) -delete

      - name: Extract version from package.json
        id: get_version
        run: echo "PACKAGE_VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

      - name: Package VSCode Extension
        run: npx --yes --package @vscode/vsce vsce package

      - name: Publish VSCode Extension
        continue-on-error: true
        env:
          VSCE_TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "TOKEN secret not set. Skipping VSCode publication." && exit 0
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            npx --yes --package @vscode/vsce vsce publish --pre-release -p "$VSCE_TOKEN"
          else
            npx --yes --package @vscode/vsce vsce publish -p "$VSCE_TOKEN"
          fi

      - name: Publish Open VSX Extension
        continue-on-error: true
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "OVSX_TOKEN secret not set. Skipping Open VSX publication." && exit 0
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            npx ovsx publish ./markupfmt-${{ env.PACKAGE_VERSION }}.vsix --pre-release -p "$OVSX_TOKEN"
          else
            npx ovsx publish ./markupfmt-${{ env.PACKAGE_VERSION }}.vsix -p "$OVSX_TOKEN"
          fi

      - name: Create GitHub release and upload VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          release_args=()
          if [ "$PRERELEASE" = "true" ]; then
            release_args+=(--prerelease)
          fi
          gh release create "v${PACKAGE_VERSION}" "./markupfmt-${PACKAGE_VERSION}.vsix" \
            --title "v${PACKAGE_VERSION}" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            "${release_args[@]}"
