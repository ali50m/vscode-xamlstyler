name: Release VSCode Extension

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish as prerelease version'
        required: true
        type: boolean
        default: false

jobs:
  release:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build XamlStyler tool
        run: |
          dotnet publish -f net8.0 -p:RollForward=Major -o ./tools/xstyler ./tools/XamlStyler/src/XamlStyler.Console
          cp ./tools/XamlStyler/LICENSE ./tools/xstyler/LICENSE

      - name: Remove unnecessary files
        run: find ./tools/xstyler -type f \( -name '*.pdb' -o -name '*.exe' -o -name '*.deps.json' \) -delete

      - name: Extract version from package.json
        id: get_version
        run: echo "PACKAGE_VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV

      - name: Package VSCode Extension
        run: npx vsce package

      - name: Publish VSCode Extension
        continue-on-error: true
        env:
          VSCE_TOKEN: ${{ secrets.TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "TOKEN secret not set. Skipping VSCode publication." && exit 0
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            npx vsce publish --pre-release
          else
            npx vsce publish
          fi

      - name: Publish Open VSX Extension
        continue-on-error: true
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "OVSX_TOKEN secret not set. Skipping Open VSX publication." && exit 0
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            npx ovsx publish ./markupfmt-${{ env.PACKAGE_VERSION }}.vsix --pre-release
          else
            npx ovsx publish ./markupfmt-${{ env.PACKAGE_VERSION }}.vsix
          fi

      - name: Create GitHub release
        if: success()
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.PACKAGE_VERSION }}
          release_name: v${{ env.PACKAGE_VERSION }}
          prerelease: ${{ inputs.prerelease }}

      - name: Upload VSIX to GitHub release
        if: success()
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./markupfmt-${{ env.PACKAGE_VERSION }}.vsix
          asset_name: markupfmt-${{ env.PACKAGE_VERSION }}.vsix
          asset_content_type: application/vnd.microsoft.vscode.vsix
